name: Tacticus Live Analysis

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  analyze:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TACTICUS_API_KEY: ${{ secrets.TACTICUS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fetch live player data
        if: env.TACTICUS_API_KEY != ''
        run: npm run fetch

      - name: Analyze account
        if: env.TACTICUS_API_KEY != ''
        run: npm run analyze

      - name: Upload analysis report
        if: success() && env.TACTICUS_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: tacticus-upgrade-report
          path: output/upgrade-report.json
          if-no-files-found: warn
          retention-days: 7
